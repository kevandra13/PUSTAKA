contoh yang membantu pembaca memahami hubungan antarkonsep.", "publisher": "Cengage Learning", "edition": "9", "year": 2021, "isbn": "9780357038314", "language": "Inggris"}, {"id": "B-05", "title": "Advanced Accounting", "author": "Floyd A. Beams, Joseph H. Anthony, Bruce Bettinghaus, Kenneth A. Smith", "subject": "Akuntansi", "kind": "Akademik", "cover": "advanced.jpg", "summary": "Referensi akuntansi lanjutan mengenai kombinasi bisnis, konsolidasi laporan keuangan, kepentingan nonpengendali, dan topik pelaporan lain. Penyajian berfokus pada hubungan antarentitas dan penyelesaian transaksi yang lebih kompleks.", "publisher": "Pearson", "edition": "13, Global Edition", "year": 2018, "isbn": "9781292214597", "language": "Inggris"}, {"id": "B-06", "title": "Management Control Systems: Performance Measurement, Evaluation and Incentives", "author": "Kenneth A. Merchant, Wim A. Van der Stede", "subject": "Manajemen", "kind": "Akademik", "cover": "control.jpg", "summary": "Buku ini membahas rancangan pengendalian manajemen, pengukuran kinerja, evaluasi, dan insentif. Pembaca diajak menilai bagaimana struktur pengendalian memengaruhi perilaku organisasi serta menimbang risiko dari pilihan ukuran dan target kinerja.", "publisher": "Pearson", "edition": "4", "year": 2017, "isbn": "9781292110554", "language": "Inggris"}, {"id": "B-07", "title": "Business Analysis & Valuation: Using Financial Statements", "author": "Krishna G. Palepu, Paul M. Healy", "subject": "Keuangan", "kind": "Akademik", "cover": "analysis.jpg", "summary": "Panduan analisis bisnis dan penilaian menggunakan laporan keuangan. Kerangka pembahasannya menghubungkan analisis strategi, kualitas informasi akuntansi, kinerja keuangan, dan proyeksi untuk memahami kondisi serta nilai suatu perusahaan.", "publisher": "South-Western / Cengage Learning", "edition": "5", "year": 2013, "isbn": "9781111972301", "language": "Inggris"}, {"id": "B-08", "title": "Public Finance and Public Policy", "author": "Jonathan Gruber", "subject": "Keuangan publik", "kind": "Akademik", "cover": "public.jpg", "summary": "Buku ini membahas alasan intervensi pemerintah, penyediaan barang publik, pajak, dan program pengeluaran negara. Teori ekonomi dipadukan dengan pembahasan kebijakan untuk menilai hubungan antara keputusan pemerintah dan kesejahteraan masyarakat.", "publisher": "Worth Publishers", "edition": "5", "year": 2016, "isbn": "9781464143335", "language": "Inggris"}, {"id": "B-09", "title": "Marwanto Harjowiryono: Maestro Simfoni Perbendaharaan", "author": "Robert Adhi KSP", "subject": "Biografi", "kind": "Nonfiksi", "cover": "marwanto.jpg", "summary": "Biografi Marwanto Harjowiryono yang menelusuri perjalanan pengabdiannya dalam pengelolaan keuangan negara. Buku ini mengangkat pengalaman kepemimpinan, reformasi birokrasi, dan perkembangan perbendaharaan melalui kisah serta pandangan para kolega.", "publisher": "", "edition": "", "year": null, "isbn": "", "language": "Indonesia"}, {"id": "B-10", "title": "The Let Them Theory", "author": "Mel Robbins", "subject": "Pengembangan diri", "kind": "Nonfiksi", "cover": "let-them.jpg", "summary": "Mel Robbins mengajak pembaca mengurangi kebiasaan mengendalikan tindakan orang lain dan kembali memusatkan perhatian pada respons diri sendiri. Gagasan ini diterapkan pada hubungan, pekerjaan, batas pribadi, dan keputusan sehari-hari.", "publisher": "Hay House", "edition": "", "year": 2024, "isbn": "9781401971373", "language": "Inggris"}, {"id": "B-11", "title": "The Alchemist", "author": "Paulo Coelho", "subject": "Fiksi inspiratif", "kind": "Fiksi", "cover": "alchemist.jpg", "summary": "Santiago, seorang penggembala muda dari Andalusia, mengikuti impian tentang harta karun dan berangkat menuju Mesir. Pertemuan sepanjang perjalanan mengajaknya memahami keberanian, pilihan hidup, serta makna dari mengejar sesuatu yang diyakininya.", "publisher": "HarperOne", "edition": "25th Anniversary", "year": 2014, "isbn": "9780062315007", "language": "Inggris"}, {"id": "B-12", "title": "The Midnight Library", "author": "Matt Haig", "subject": "Fiksi kontemporer", "kind": "Fiksi", "cover": "midnight.jpeg", "summary": "Nora Seed menemukan perpustakaan di antara hidup dan mati, dengan buku-buku yang membuka kemungkinan kehidupan berbeda. Saat menjelajahi pilihan yang dahulu tidak diambil, ia mempertanyakan penyesalan dan arti kehidupan yang ingin dijalaninya.", "publisher": "Canongate Books", "edition": "", "year": 2020, "isbn": "", "language": "Inggris"}, {"id": "B-13", "title": "A Gentle Reminder", "author": "Bianca Sparacino", "subject": "Prosa reflektif", "kind": "Nonfiksi", "cover": "gentle.jpg", "summary": "Kumpulan tulisan reflektif tentang kasih sayang, penerimaan diri, kehilangan, dan proses bertumbuh. Bianca Sparacino menawarkan pengingat untuk memperlakukan diri dengan lebih lembut dan memberi ruang bagi pemulihan melalui pengalaman sehari-hari.", "publisher": "", "edition": "", "year": null, "isbn": "", "language": "Inggris"}, {"id": "B-14", "title": "Funiculi Funicula", "author": "Toshikazu Kawaguchi", "subject": "Fiksi Jepang", "kind": "Fiksi", "cover": "funiculi.jpg", "summary": "Di sebuah kafe tua di Tokyo, pengunjung dapat kembali ke masa lalu dengan aturan yang ketat: mereka harus kembali sebelum kopi menjadi dingin. Kisah para pengunjung menelusuri penyesalan, perpisahan, dan keberanian menyampaikan perasaan.", "publisher": "Gramedia Pustaka Utama", "edition": "Before the Coffee Gets Cold", "year": null, "isbn": "", "language": "Indonesia"}, {"id": "B-15", "title": "Funiculi Funicula 2: Kisah-Kisah yang Baru Terungkap", "author": "Toshikazu Kawaguchi", "subject": "Fiksi Jepang", "kind": "Fiksi", "cover": "funiculi2.jpg", "summary": "Kafe Funiculi Funicula kembali mempertemukan orang-orang dengan kesempatan mengunjungi masa lalu. Kisah baru menyoroti hubungan, kesempatan yang terlewat, dan pesan yang belum tersampaikan, dengan aturan perjalanan waktu yang tetap harus dipatuhi.", "publisher": "Gramedia Pustaka Utama", "edition": "", "year": null, "isbn": "", "language": "Indonesia"}, {"id": "B-16", "title": "Funiculi Funicula: Dona Dona", "author": "Toshikazu Kawaguchi", "subject": "Fiksi Jepang", "kind": "Fiksi", "cover": "dona.jpg", "summary": "Kisah berlanjut di kafe Dona Dona di Hakodate, tempat secangkir kopi menawarkan kesempatan melintasi waktu. Para pengunjung membawa persoalan dan kerinduan masing-masing, lalu menemukan cara baru memandang hubungan serta masa depan.", "publisher": "Gramedia Pustaka Utama", "edition": "", "year": null, "isbn": "", "language": "Indonesia"}, {"id": "B-17", "title": "Seporsi Mie Ayam Sebelum Mati", "author": "Brian Khrisna", "subject": "Fiksi Indonesia", "kind": "Fiksi", "cover": "mie.jpg", "summary": "Ale berada pada titik ketika hidup terasa kehilangan arah. Keinginan sederhana untuk menikmati semangkuk mie ayam membawanya pada perjalanan dan pertemuan yang membuatnya meninjau kembali kesepian, hubungan dengan orang lain, dan alasan untuk bertahan.", "publisher": "", "edition": "", "year": null, "isbn": "", "language": "Indonesia"}, {"id": "B-18", "title": "Keajaiban Toko Kelontong Namiya", "author": "Keigo Higashino", "subject": "Fiksi Jepang", "kind": "Fiksi", "cover": "namiya.jpg", "summary": "Tiga pemuda berlindung di sebuah toko kelontong kosong dan menerima surat yang seolah datang dari masa lalu. Saat membalas permintaan nasihat itu, mereka menemukan hubungan tak terduga antara pilihan, harapan, dan kehidupan banyak orang.", "publisher": "Gramedia Pustaka Utama", "edition": "", "year": null, "isbn": "", "language": "Indonesia"}, {"id": "B-19", "title": "Kesetiaan Mr. X", "author": "Keigo Higashino", "subject": "Misteri", "kind": "Fiksi", "cover": "kesetiaan.jpg", "summary": "Kasus pembunuhan yang melibatkan Yasuko Hanaoka mempertemukan penyelidikan Detektif Kusanagi dengan kecerdasan matematikawan Ishigami. Fisikawan Manabu Yukawa ikut menelusuri alibi yang sulit dipatahkan, dalam kisah tentang pengorbanan dan batas kesetiaan.", "publisher": "Gramedia Pustaka Utama", "edition": "Devotion of Suspect X", "year": 2021, "isbn": "9786020330525", "language": "Indonesia"}, {"id": "B-20", "title": "Laut Bercerita", "author": "Leila S. Chudori", "subject": "Sastra Indonesia", "kind": "Fiksi", "cover": "laut-clean.jpg", "summary": "Biru Laut dan kawan-kawannya menjalani kehidupan sebagai aktivis di tengah represi. Melalui sudut pandang Laut serta adiknya, Asmara, novel ini membahas persahabatan, kehilangan, dan keluarga yang terus mencari jawaban atas penghilangan orang-orang terkasih.", "publisher": "Kepustakaan Populer Gramedia", "edition": "Sampul keras", "year": 2022, "isbn": "9786024818722", "language": "Indonesia"}, {"id": "B-21", "title": "Ronggeng Dukuh Paruk", "author": "Ahmad Tohari", "subject": "Sastra Indonesia", "kind": "Fiksi", "cover": "ronggeng.jpg", "summary": "Srintil tumbuh menjadi ronggeng di Dukuh Paruk, sementara Rasus mencari jalannya sendiri. Tradisi desa, hubungan pribadi, dan pergolakan politik membentuk perjalanan mereka dalam novel tentang martabat manusia dan kehidupan masyarakat pedesaan.", "publisher": "Gramedia Pustaka Utama", "edition": "", "year": 2009, "isbn": "", "language": "Indonesia"}, {"id": "B-22", "title": "The Poppy War", "author": "R. F. Kuang", "subject": "Fantasi", "kind": "Fiksi", "cover": "poppy.jpg", "summary": "Rin berhasil memasuki akademi militer bergengsi dan menemukan kemampuan yang berhubungan dengan kekuatan para dewa. Ketika perang mengancam negerinya, ia dihadapkan pada pilihan berat tentang kekuasaan, identitas, serta harga dari kemenangan.", "publisher": "Harper Voyager", "edition": "", "year": 2018, "isbn": "9780062662569", "language": "Inggris"}, {"id": "B-23", "title": "Madilog: Materialisme, Dialektika, dan Logika", "author": "Tan Malaka", "subject": "Filsafat", "kind": "Nonfiksi", "cover": "madilog.jpg", "summary": "Tan Malaka menguraikan materialisme, dialektika, dan logika sebagai perangkat berpikir rasional. Buku ini mengajak pembaca menelaah hubungan antara ilmu pengetahuan, masyarakat, dan cara memahami kenyataan secara kritis.", "series": "", "publisher": "", "edition": "", "year": null, "isbn": "", "language": "Indonesia"}, {"id": "B-24", "title": "Sisi Tergelap Surga", "author": "Brian Khrisna", "subject": "Fiksi Indonesia", "kind": "Fiksi", "cover": "sisi-surga.jpg", "summary": "Di balik janji kehidupan yang lebih baik di Jakarta, orang-orang di sebuah kampung berjuang menghadapi kemiskinan dan kehilangan harapan. Kisah ini menyoroti kehidupan yang sering luput dari pandangan di tengah gemerlap ibu kota.", "series": "", "publisher": "Gramedia Pustaka Utama", "edition": "", "year": 2023, "isbn": "9786020674384", "language": "Indonesia"}, {"id": "B-25", "title": "Pulang", "author": "Leila S. Chudori", "subject": "Sastra Indonesia", "kind": "Fiksi", "cover": "pulang-leila.jpg", "summary": "Dimas Suryo menjalani pengasingan di Paris setelah peristiwa 1965. Bertahun-tahun kemudian, putrinya, Lintang Utara, datang ke Indonesia dan menelusuri kisah keluarga, ingatan sejarah, serta makna tanah air.", "series": "", "publisher": "Kepustakaan Populer Gramedia", "edition": "", "year": 2023, "isbn": "", "language": "Indonesia"}, {"id": "B-26", "title": "Namaku Alam", "author": "Leila S. Chudori", "subject": "Sastra Indonesia", "kind": "Fiksi", "cover": "namaku-alam.jpg", "summary": "Segara Alam meninjau kembali masa kecil hingga dewasa dengan ingatan yang sangat tajam. Sebagai anak seorang korban tragedi 1965, ia menghadapi stigma, pertemanan, cinta, dan pertanyaan tentang jati dirinya.", "series": "", "publisher": "Kepustakaan Populer Gramedia", "edition": "", "year": 2023, "isbn": "", "language": "Indonesia"}, {"id": "B-27", "title": "Seorang Pria yang Melalui Duka dengan Mencuci Piring", "author": "Andreas Kurniawan", "subject": "Memoar", "kind": "Nonfiksi", "cover": "duka-piring.jpg", "summary": "Seorang psikiater menghadapi kehilangan dalam hidupnya sendiri dan meninjau kembali pemahamannya tentang duka. Pengalaman pribadi serta kisah dari praktiknya menunjukkan bahwa proses menghadapi kehilangan dapat berlangsung melalui tindakan sehari-hari yang sederhana.", "series": "", "publisher": "Gramedia Pustaka Utama", "edition": "", "year": 2025, "isbn": "", "language": "Indonesia"}, {"id": "B-28", "title": "Filosofi Teras", "author": "Henry Manampiring", "subject": "Filsafat", "kind": "Nonfiksi", "cover": "filosofi-teras.jpg", "summary": "Henry Manampiring memperkenalkan prinsip Stoisisme melalui persoalan yang dekat dengan kehidupan sehari-hari. Buku ini membahas cara membedakan hal yang dapat dikendalikan, menyikapi emosi, dan membangun respons yang lebih tenang terhadap perubahan.", "series": "", "publisher": "Penerbit Buku Kompas", "edition": "", "year": null, "isbn": "", "language": "Indonesia"}, {"id": "B-29", "title": "Atomic Habits", "author": "James Clear", "subject": "Pengembangan diri", "kind": "Nonfiksi", "cover": "atomic.jpg", "summary": "James Clear menjelaskan bagaimana perubahan kecil yang diulang dapat membentuk kebiasaan. Pembaca mempelajari peran lingkungan, identitas, serta sistem sehari-hari dalam membangun kebiasaan baru dan mengurangi perilaku yang ingin ditinggalkan.", "series": "", "publisher": "Avery", "edition": "", "year": 2018, "isbn": "9780735211292", "language": "Inggris"}, {"id": "B-30", "title": "As Long as the Lemon Trees Grow", "author": "Zoulfa Katouh", "subject": "Fiksi kontemporer", "kind": "Fiksi", "cover": "lemon.jpg", "summary": "Salama Kassab membantu korban konflik di sebuah rumah sakit di Homs, Suriah. Di tengah ketakutan dan kehilangan, ia menghadapi pilihan antara meninggalkan tanah air dan bertahan, sambil berusaha menjaga harapan serta orang-orang yang dicintainya.", "series": "", "publisher": "", "edition": "", "year": null, "isbn": "", "language": "Inggris"}, {"id": "B-31", "title": "Bicara Itu Ada Seninya", "author": "Oh Su Hyang", "subject": "Komunikasi", "kind": "Nonfiksi", "cover": "bicara.jpg", "summary": "Panduan komunikasi yang membahas cara menyampaikan gagasan, membangun kesan, dan memahami lawan bicara. Contoh serta pembahasan teknik berbicara membantu pembaca menata pesan, meningkatkan kepercayaan diri, dan berkomunikasi dalam berbagai situasi.", "series": "", "publisher": "Bhuana Ilmu Populer", "edition": "", "year": null, "isbn": "9786024553920", "language": "Indonesia"}, {"id": "B-32", "title": "Man's Search for Meaning", "author": "Viktor E. Frankl", "subject": "Psikologi", "kind": "Nonfiksi", "cover": "meaning.jpg", "summary": "Viktor Frankl merefleksikan pengalaman bertahan di kamp konsentrasi dan memperkenalkan logoterapi. Buku ini menelaah bagaimana pencarian makna dapat membantu seseorang menghadapi penderitaan, membuat pilihan, dan mempertahankan tujuan hidup.", "series": "", "publisher": "Beacon Press", "edition": "", "year": 2006, "isbn": "9780807014271", "language": "Inggris"}, {"id": "B-33", "title": "Hujan", "author": "Tere Liye", "subject": "Fiksi Indonesia", "kind": "Fiksi", "cover": "hujan.jpg", "summary": "Lail tumbuh setelah bencana besar mengubah kehidupannya. Pertemuan dengan Esok, persahabatan, dan perubahan dunia membawanya pada perjalanan tentang ingatan, cinta, serta keputusan untuk mempertahankan atau melepaskan masa lalu.", "series": "Pilihan Tere Liye", "publisher": "Sabak Grip Nusantara", "edition": "", "year": null, "isbn": "", "language": "Indonesia"}, {"id": "B-34", "title": "Rindu", "author": "Tere Liye", "subject": "Fiksi Indonesia", "kind": "Fiksi", "cover": "rindu.jpg", "summary": "Sebuah kapal membawa para penumpang dalam perjalanan haji yang panjang. Kisah dan pergulatan batin mereka saling bertemu, menghadirkan pertanyaan tentang penyesalan, cinta, masa lalu, serta keberanian mencari jawaban.", "series": "Pilihan Tere Liye", "publisher": "Sabak Grip Nusantara", "edition": "", "year": null, "isbn": "", "language": "Indonesia"}, {"id": "B-35", "title": "Bumi", "author": "Tere Liye", "subject": "Fantasi", "kind": "Fiksi", "cover": "bumi.jpg", "summary": "Raib menyimpan kemampuan yang berbeda dari teman-temannya. Bersama Seli dan Ali, ia menemukan dunia paralel dan rahasia tentang asal-usulnya, dalam petualangan yang menguji persahabatan serta keberanian.", "series": "Serial Bumi · 1", "publisher": "Sabak Grip Nusantara", "edition": "", "year": null, "isbn": "", "language": "Indonesia"}, {"id": "B-36", "title": "Bulan", "author": "Tere Liye", "subject": "Fantasi", "kind": "Fiksi", "cover": "bulan.jpg", "summary": "Petualangan Raib, Seli, dan Ali berlanjut menuju Klan Matahari. Bersama Ily, mereka menghadapi tantangan dalam perjalanan mencari bunga matahari yang mempertemukan ambisi, kerja sama, dan konsekuensi dari sebuah pilihan.", "series": "Serial Bumi · 2", "publisher": "Sabak Grip Nusantara", "edition": "", "year": null, "isbn": "", "language": "Indonesia"}, {"id": "B-37", "title": "Matahari", "author": "Tere Liye", "subject": "Fantasi", "kind": "Fiksi", "cover": "matahari.jpg", "summary": "Rasa ingin tahu Ali membawa tiga sahabat pada penjelajahan baru yang menyimpan bahaya. Raib, Seli, dan Ali kembali berhadapan dengan rahasia dunia paralel yang menguji kemampuan serta kepercayaan mereka satu sama lain.", "series": "Serial Bumi · 3", "publisher": "Sabak Grip Nusantara", "edition": "", "year": null, "isbn": "", "language": "Indonesia"}, {"id": "B-38", "title": "Negeri Para Bedebah", "author": "Tere Liye", "subject": "Thriller", "kind": "Fiksi", "cover": "bedebah.jpg", "summary": "Thomas, seorang konsultan keuangan, berusaha menyelamatkan bank keluarganya di tengah krisis. Ia memasuki jaringan kekuasaan dan kepentingan yang berbahaya, sambil menghadapi pengkhianatan serta waktu yang terus menipis.", "series": "Pilihan Tere Liye", "publisher": "Sabak Grip Nusantara", "edition": "", "year": null, "isbn": "", "language": "Indonesia"}, {"id": "B-39", "title": "Pulang", "author": "Tere Liye", "subject": "Fiksi Indonesia", "kind": "Fiksi", "cover": "pulang-tere.jpg", "summary": "Bujang men ary": "Harry terseret ke dalam Turnamen Triwizard yang mempertemukan tiga sekolah sihir. Tantangan berbahaya, persaingan, dan tanda-tanda kebangkitan ancaman lama membuat tahun keempatnya berbeda dari sebelumnya.", "series": "Harry Potter · 4", "publisher": "Arthur A. Levine Books", "edition": "", "year": 2000, "isbn": "9780439139595", "language": "Inggris"}, {"id": "B-44", "title": "Harry Potter and the Order of the Phoenix", "author": "J. K. Rowling", "subject": "Fantasi", "kind": "Fiksi", "cover": "hp5.jpg", "summary": "Saat kembalinya Voldemort diragukan banyak orang, Harry menghadapi tekanan di sekolah dan dunia sihir. Ia belajar tentang perlawanan, solidaritas, dan kelompok yang bersiap menghadapi bahaya.", "series": "Harry Potter · 5", "publisher": "Scholastic Inc.", "edition": "", "year": 2004, "isbn": "9780439358071", "language": "Inggris"}, {"id": "B-45", "title": "Harry Potter and the Half-Blood Prince", "author": "J. K. Rowling", "subject": "Fantasi", "kind": "Fiksi", "cover": "hp6.jpg", "summary": "Harry mendalami masa lalu Voldemort bersama Dumbledore, sementara sebuah buku pelajaran lama menyimpan catatan misterius. Kehidupan di Hogwarts terus berjalan di bawah bayangan konflik yang semakin dekat.", "series": "Harry Potter · 6", "publisher": "Scholastic", "edition": "", "year": 2006, "isbn": "9780439785969", "language": "Inggris"}, {"id": "B-46", "title": "Harry Potter and the Deathly Hallows", "author": "J. K. Rowling", "subject": "Fantasi", "kind": "Fiksi", "cover": "hp7.jpg", "summary": "Harry, Ron, dan Hermione meninggalkan kehidupan sekolah untuk menjalankan misi melawan Voldemort. Pencarian mereka menuntut kepercayaan dan pengorbanan, sekaligus mengungkap hubungan antara masa lalu dan relikui legendaris.", "series": "Harry Potter · 7", "publisher": "Arthur A. Levine Books", "edition": "", "year": 2007, "isbn": "9780545010221", "language": "Inggris"}, {"id": "B-47", "title": "The Lightning Thief", "author": "Rick Riordan", "subject": "Fantasi", " function profileSection(){return `<section class="profile-section" id="profil"><div class="profile-image"><img src="asset-061.jpg" alt="Ruang baca Perpustakaan PKN STAN"><span>PERPUSTAKAAN / PKN STAN</span></div><div class="profile-copy"><div class="eyebrow">Mengenal perpustakaan</div><h2>Ruang bagi pengetahuan.<br>Tempat bagi pertumbuhan.</h2><p>Perpustakaan PKN STAN mendukung kegiatan pendidikan dan penelitian sivitas akademika melalui layanan informasi, koleksi tercetak, dan sumber digital.</p><p>Koleksi buku, ruang diskusi, serta akses karya ilmiah membantu mahasiswa menemukan referensi dan mengembangkan gagasan.</p><div class="profile-details"><div><b>Lokasi</b><span>Gedung P, Kampus PKN STAN<br>Bintaro Jaya, Tangerang Selatan</span></div><div><b>Hubungi kami</b><a href="mailto:perpustakaan@pknstan.ac.id">perpustakaan@pknstan.ac.id</a><a href="https://perpustakaan.pknstan.ac.id/" target="_blank" rel="noopener noreferrer">Profil dan informasi resmi</a></div></div></div></section><section class="news-section" id="berita"><div class="row spread section-head"><div><div class="eyebrow">Dari meja perpustakaan</div><h2>Kabar & kegiatan</h2></div><a class="small" href="https://perpustakaan.pknstan.ac.id/" target="_blank" rel="noopener noreferrer">Kunjungi berita resmi</a></div><div class="news-grid">${NEWS.map((n,i)=>`<article class="news-card"><div class="news-meta"><span>${esc(n.category)}</span><time>${n.date}</time></div><span class="news-number">0${i+1}</span><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p><a href="${n.url}" target="_blank" rel="noopener noreferrer">Baca berita</a></article>`).join('')}</div><p class="small muted source-note">Pilihan arsip dari situs resmi perpustakaan; tanggal mengikuti tanggal publikasi sumber.</p></section>`}
function dashboardOriginal(){const ls=own(db.loans),active=ls.filter(l=>!l.closed),is=db.invoices.filter(i=>i.status==='Terbit'&&(role!=='member'||invMember(i)===currentMember)&&!settled(i));return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Ruang baca. Ruang bertumbuh.</div><h1>Buku yang tepat.<br>Di waktu yang tepat.</h1><p>Untuk tugas yang menunggu, rasa ingin tahu, atau cerita yang menemani jedamu.</p><form data-form="search" class="search"><input name="q" aria-label="Cari judul, penulis atau ISBN" placeholder="Cari judul, penulis, atau ISBN"><button class="btn" type="submit">Cari buku</button></form><div class="subject-chips">${['Akuntansi','Fiksi Jepang','Sastra Indonesia','Pengembangan diri'].map(x=>`<button type="button" data-action="category:${x}">${x}</button>`).join('')}</div></div><div class="hero-visual"><div class="hero-photo-frame"><img class="hero-art" src="asset-060.png" alt="Mesin tik vintage berwarna biru di antara buku"></div><div class="art-caption">SATU HALAMAN, BANYAK KEMUNGKINAN</div></div></section><section class="welcome-strip"><div class="row spread"><h2>Halo, ${esc(WHO[role].split(' ')[0])}.</h2><span class="small muted">${fmt(new Date())} · Data contoh</span></div><div class="stats"><a class="stat" href="#monitor"><div>${icon('book')}<span>Pinjaman ${role==='member'?'saya':'aktif'}<small>Riwayat dan jatuh tempo</small></span></div><b>${String(active.length).padStart(2,'0')}</b></a><a class="stat" href="#rooms"><div>${icon('calendar')}<span>Reservasi ruang<small>Jadwal mendatang</small></span></div><b>${String(own(db.reservations).filter(r=>['Terkonfirmasi','Digunakan'].includes(r.status)&&r.date>=today).length).padStart(2,'0')}</b></a><a class="stat" href="#payment"><div>${icon('receipt')}<span>Tagihan ganti rugi<small>${is.length} belum lunas</small></span></div><b style="font-size:20px">${rupiah(is.reduce((a,i)=>a+i.amount,0))}</b></a></div></section><div class="dashboard-content"><div class="split"><section><div class="row spread section-head"><div><div class="eyebrow">Di rak pilihan</div><h2>Cerita pilihan untuk jedamu</h2></div><a href="#catalog" class="small">Semua buku →</a></div><div class="book-grid">${['B-19','B-20','B-24','B-12'].map(book).filter(Boolean).map(bookCard).join('')}</div></section><section class="reading-note"><div class="eyebrow">Sedang kamu baca</div><h2>Satu bab lagi.</h2>${active.slice(0,2).map(l=>`<div class="timeline"><b>${esc(book(copy(l.copy).book).title)}</b><span class="small">Jatuh tempo</span><strong class="due-date">${fmt(l.due)}</strong>${tag(l.due<today?'Terlambat':'Masih dipinjam')}<button type="button" class="postcard-link" data-action="loanreceipt:${l.id}">Lihat kartu peminjaman →</button></div>`).join('')||'<p class="muted" style="margin-top:20px">Belum ada pinjaman aktif.</p>'}<div style="margin-top:20px">${btn('Lihat pinjaman','go:monitor','secondary')}</div></section></div>${role==='admin'?`<section class="panel approval-summary"><div><div class="eyebrow">Perlu ditinjau</div><h2>Persetujuan transaksi</h2><p class="small muted">${db.losses.filter(x=>x.status==='Dilaporkan').length} kasus kehilangan · ${db.invoices.filter(x=>x.status==='Draf').length} draf tagihan · ${db.reversals.filter(x=>x.status==='Menunggu').length} pembalikan pembayaran</p></div>${btn('Tinjau kehilangan & tagihan','go:loss')}${btn('Tinjau pembalikan','go:payment','secondary')}</section>`:''}${arrivalSection()}${profileSection()}</div>`}
function icon(kind){const paths={book:'<path d="M3 5c4-1 6-1 9 1v15c-3-2-5-2-9-1zM21 5c-4-1-6-1-9 1v15c3-2 5-2 9-1z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v5M17 3v5M3 11h18"/>',receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4"/>',bell:'<path d="M5 17h14l-2-3V9a5 5 0 00-10 0v5zM10 21h4"/>'};return `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${paths[kind]||paths.book}</svg>`}
function bookCard(b){const cs=db.copies.filter(c=>c.book===b.id),n=cs.filter(available).length;return `<button type="button" class="book-card" data-action="detail:${b.id}" aria-label="Lihat profil dan sinopsis ${esc(b.title)}"><div class="cover-stage">${coverImage(b)}</div><h3>${esc(b.title)}</h3><p class="muted">${esc(b.author)}</p>${b.series?`<p class="book-series">${esc(b.series)}</p>`:""}${ratingBadge(b.id)}${tag(n?`${n} tersedia`:'Belum tersedia')}</button>`}
function catalog(){let bs=db.books.filter(b=>(b.title+' '+b.author+' '+b.isbn+' '+b.subject+' '+(b.series||'')).toLowerCase().includes(searchTerm.toLowerCase())&&(!filter||b.subject===filter)&&(!collectionFilter||b.kind===collectionFilter)&&(!shelfFilter||(b.author+' '+b.title+' '+(b.series||'')).toLowerCase().includes(shelfFilter.toLowerCase())));if(catalogSort==='local')bs.sort((a,b)=>(localRating(b.id).rating??-1)-(localRating(a.id).rating??-1)||localRating(b.id).count-localRating(a.id).count||a.title.localeCompare(b.title,'id'));else if(catalogSort==='external')bs.sort((a,b)=>(EXTERNAL_RATINGS[b.id]?.rating??-1)-(EXTERNAL_RATINGS[a.id]?.rating??-1)||a.title.localeCompare(b.title,'id'));else if(catalogSort==='title')bs.sort((a,b)=>a.title.localeCompare(b.title,'id'));return head('Katalog buku','Temukan referensi, cerita, dan perspektif baru.',role==='officer'?btn('Tambah buku','newbook'):'')+`<div class="category-tabs" role="group" aria-label="Jenis koleksi">${[['','Semua koleksi'],['Akademik','Akademik'],['Fiksi','Fiksi'],['Nonfiksi','Nonfiksi']].map(([k,t])=>`<button type="button" data-action="collection:${k}" class="${collectionFilter===k?'selected':''}" aria-pressed="${collectionFilter===k}">${t}</button>`).join('')}</div><div class="collection-shelves" role="group" aria-label="Koleksi pilihan">${[["","Semua penulis / seri"],["Keigo Higashino","Keigo Higashino"],["Tere Liye","Tere Liye"],["Harry Potter","Harry Potter"],["Percy Jackson","Percy Jackson"],["Oxford World's Classics","Oxford World’s Classics"]].map(([k,t])=>`<button type="button" data-action="shelf:${k}" class="${shelfFilter===k?"selected":""}" aria-pressed="${shelfFilter===k}">${t}</button>`).join("")}</div><div class="toolbar catalog-toolbar"><input id="catalog-search" placeholder="Cari judul, penulis, atau ISBN" value="${esc(searchTerm)}" aria-label="Pencarian katalog"><select id="catalog-filter" aria-label="Kategori buku"><option value="">Semua kategori</option>${[...new Set(db.books.map(b=>b.subject))].sort().map(s=>`<option value="${esc(s)}" ${s===filter?'selected':''}>${esc(s)}</option>`).join('')}</select><select id="catalog-sort" aria-label="Urutkan katalog">${[['default','Urutan koleksi'],['local','Rating anggota tertinggi'],['external','Rating Goodreads tertinggi'],['title','Judul A–Z']].map(([v,l])=>`<option value="${v}" ${catalogSort===v?'selected':''}>${l}</option>`).join('')}</select></div><p class="small muted" style="margin-bottom:24px">${bs.length} judul · Buka buku untuk membaca profil dan sinopsis.</p><div class="book-grid">${bs.map(bookCard).join('')||'<div class="empty">Tidak ada buku yang cocok. Coba kata kunci atau kategori lain.</div>'}</div><p class="small muted" style="margin-top:26px">Rating anggota dihitung dari ulasan pengembalian terverifikasi. Referensi Goodreads tersedia untuk 8 judul, dicatat 4 Oktober 2026 dan dapat berubah. Buku tanpa rating tampil setelah buku berating saat diurutkan. Jumlah eksemplar dan lokasi rak merupakan data contoh.</p>`}

function detail(){const b=book(selectedBook)||db.books[0];return detailOriginal()+reviewSections(b)}
function detailOriginal(){const b=book(selectedBook)||db.books[0],cs=db.copies.filter(c=>c.book===b.id),n=cs.filter(available).length,pending=db.requests.find(r=>r.member===currentMember&&r.book===b.id&&r.status==='Menunggu');return head('Profil buku','Kenali bukunya sebelum meminjam.',btn('← Kembali ke katalog','go:catalog','secondary'))+`<section class="detail-layout"><div class="cover-stage">${coverImage(b)}</div><div><div class="eyebrow">${esc(b.kind||'Koleksi')} · ${esc(b.subject)}</div><h2>${esc(b.title)}</h2><p class="author-line">${esc(b.author)}</p><h3>${b.kind==='Akademik'?'Tentang buku':'Sinopsis'}</h3><p class="summary">${esc(b.summary||'Ringkasan buku belum ditambahkan oleh petugas.')}</p><div class="book-meta"><div><span>Penerbit</span>${esc(b.publisher||'Belum dicantumkan')}</div><div><span>Edisi</span>${esc(b.edition||'Belum dicantumkan')}</div><div><span>Tahun edisi</span>${esc(b.year||'Belum dicantumkan')}</div><div><span>Bahasa</span>${esc(b.language||'Belum dicantumkan')}</div><div><span>ISBN</span>${esc(b.isbn||'Belum dicantumkan')}</div><div><span>Referensi katalog</span>${esc(b.id)}</div>${b.series?`<div><span>Seri / koleksi</span>${esc(b.series)}</div>`:""}</div><div class="availability-line">${tag(n?'Tersedia':'Belum tersedia')}<span class="small muted">${n} dari ${cs.length} eksemplar dapat dipinjam</span></div>${role==='member'?(pending?`${tag('Menunggu petugas')} <a href="#monitor" class="small">Lihat permintaan ${pending.id}</a>`:`<button class="btn" type="button" data-action="request:${b.id}" ${n?'':'disabled'}>Pinjam buku</button>`):role==='officer'?btn('Catat peminjaman','go:borrow'):'<p class="small muted">Pencatatan peminjaman dilakukan petugas perpustakaan.</p>'}<p class="small muted" style="margin-top:12px">${role==='member'?'Ajukan permintaan, lalu bawa buku fisik ke meja layanan. Pinjaman dimulai setelah dicatat petugas.':'Ketersediaan dihitung per eksemplar berdasarkan kondisi dan pinjaman aktif.'}</p></div></section><section class="detail-bottom"><div class="row spread"><h2>Daftar eksemplar</h2>${role==='officer'?btn('Tambah eksemplar','newcopy:'+b.id,'secondary'):''}</div>${table(['Kode eksemplar','Judul buku','Lokasi rak','Status'],cs.map(c=>[c.id,esc(b.title),esc(c.shelf),tag(available(c)?'Tersedia':open(c.id)?'Dipinjam':c.condition)]))}<p class="small muted">Kode dan jumlah eksemplar adalah data demonstrasi; setiap kode mewakili satu buku fisik.</p></section>`}
function members(){let ms=role==='member'?db.members.filter(m=>m.id===currentMember):db.members.filter(m=>(m.name+' '+m.id+' '+(m.display_id||'')+' '+m.identity).toLowerCase().includes(searchTerm.toLowerCase()));return head(role==='member'?'Profil anggota':'Data anggota','Status keanggotaan menentukan akses layanan.',role==='officer'?btn('Daftarkan anggota','newmember'):'')+`${role!=='member'?`<div class="toolbar"><input id="member-search" aria-label="Cari anggota" placeholder="Nama, nomor anggota, atau identitas" value="${esc(searchTerm)}"></div>`:''}`+table(['Nomor / identitas','Nama','Program studi','Kategori','Status','Tindakan'],ms.map(m=>[`${m.id}<br><span class="small muted">${esc(m.identity)}</span>`,esc(m.name),esc(m.program||'Belum dipilih'),esc(m.type),tag(m.status),role==='admin'?'Baca saja':btn('Ubah kontak','editmember:'+m.id,'secondary')+(role==='officer'?btn(m.status==='Aktif'?'Nonaktifkan':m.status==='Menunggu'?'Verifikasi':'Aktifkan','memberstate:'+m.id,'ghost'):'')]))}
function borrow(){return head('Transaksi peminjaman','Satu transaksi dapat memuat beberapa eksemplar.')+note('Parameter demonstrasi: maksimal 3 eksemplar aktif dan masa pinjam 7 hari. Kebijakan sebenarnya harus ditetapkan institusi.')+`<div class="split"><section class="panel"><h2 style="margin-bottom:22px">Pindai anggota dan buku</h2>${role==='admin'?'<p>Admin meninjau transaksi; pencatatan dilakukan petugas.</p>':form('borrow',select('Anggota','member',db.members.map(m=>[m.id,`${m.id} · ${m.name} (${m.status})`]))+`<div class="field full"><label for="barcodes">Kode batang eksemplar</label><textarea id="barcodes" name="barcodes" required placeholder="CP-002, CP-004"></textarea><small>Pisahkan dengan koma. Semua eksemplar harus tersedia.</small></div>`+field('Tanggal pinjam','date','text',fmt(new Date()),'readonly')+field('Jatuh tempo','due','text',fmt(plus(7)),'readonly'),'Periksa dan simpan pinjaman')}</section><section class="panel blue"><h2>Pemeriksaan layanan</h2><div class="checks"><span>✓ Keanggotaan aktif</span><span>✓ Kuota masih tersedia</span><span>✓ Kode batang tidak ganda</span><span>✓ Setiap eksemplar tersedia</span><span>✓ Jatuh tempo otomatis</span></div><p class="small">Bukti diterbitkan setelah transaksi berhasil.</p></section></div>`+loanTable(db.loans.filter(l=>!l.closed))}
function loanTable(ls){return table(['No. pinjaman','Anggota','Buku / eksemplar','Jatuh tempo','Status','Bukti'],ls.map(l=>[l.id,esc(member(l.member).name),esc(book(copy(l.copy).book).title)+`<br><span class="small muted">${l.copy}</span>`,fmt(l.due),tag(l.closed?l.outcome:l.due<today?'Terlambat':'Dipinjam'),btn(canReviewLoan(l)?'Bukti kembali':'Kartu pinjam','loanreceipt:'+l.id,'secondary')+(role==='member'&&l.member===currentMember&&canReviewLoan(l)?btn(db.reviews.some(r=>r.book===copy(l.copy).book&&r.member===currentMember)?'Ubah ulasan':'Beri ulasan','bookreview:'+l.id,'secondary'):'')]))}
function returns(){return head('Pengembalian buku','Catat penerimaan fisik dan kondisi buku.')+`<section class="panel">${role==='admin'?'<p>Admin meninjau transaksi; pencatatan dilakukan petugas.</p>':form('return',select('Pinjaman terbuka','loan',db.loans.filter(l=>!l.closed).map(l=>[l.id,`${l.id} · ${l.copy} · ${member(l.member).name}`]))+select('Kondisi diterima','condition',['Baik','Rusak'])+`<div class="field full"><label for="notes">Catatan pemeriksaan</label><textarea id="notes" name="notes" placeholder="Wajib diisi bila buku rusak"></textarea></div>`,'Simpan pengembalian')}</section>`+note('Keterlambatan dicatat untuk pemantauan. Tidak ada denda otomatis dalam rancangan ini.')+loanTable(db.loans.filter(l=>l.closed))}

function validateReservation(d){const m=member(currentMember),r=db.rooms.find(x=>x.id===d.room);if(!m||m.status!=='Aktif'||!r)throw Error('Keanggotaan atau ruang tidak valid.');if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||!/^\d{2}:\d{2}$/.test(d.start)||!/^\d{2}:\d{2}$/.test(d.end))throw Error('Tanggal atau waktu tidak valid.');if(d.date<today||d.date>plus(1))throw Error('Pemesanan dibuka H-1. Pilih hari ini atau besok.');const weekday=new Date(d.date+'T12:00:00+07:00').getUTCDay();if(weekday===0||weekday===6)throw Error('Ruang diskusi hanya digunakan Senin–Jumat.');if(d.start>=d.end||d.start<'08:00'||d.end>'17:00'||roomInstant(d.date,d.start)<=new Date())throw Error('Pilih waktu mendatang pada 08.00–17.00 WIB; selesai harus setelah mulai.');if(d.start>='12:00'&&d.start<'13:00')throw Error('Penggunaan tidak boleh dimulai pukul 12.00–12.59 WIB.');const duration=minutes(d.end)-minutes(d.start);if(duration>120)throw Error('Satu kelompok maksimal 2 jam per hari. Perpanjangan melalui petugas jika tidak ada pemesan lain.');if(!Number.isInteger(+d.participants)||+d.participants<3||+d.participants>r.capacity)throw Error('Jumlah peserta harus 3–'+r.capacity+' orang.');if(!d.phone||!/^\+?[0-9]{9,15}$/.test(d.phone)||!d.group?.trim()||!d.purpose?.trim()||d.accepted!=='yes')throw Error('Lengkapi nomor HP, kelompok, tujuan, dan persetujuan aturan.');const nims=String(d.nims||'').split(/[\s,;]+/).filter(Boolean);if(nims.length!==+d.participants||new Set(nims).size!==nims.length||nims.some(n=>!/^\d{9,15}$/.test(n)))throw Error('Isi NIM unik seluruh peserta sesuai jumlah anggota kelompok.');if(!nims.includes(m.identity))throw Error('NIM pemesan harus tercantum sebagai peserta.');refreshRoomSchedules();const conflict=db.reservations.find(x=>x.room===r.id&&x.date===d.date&&roomActive(x)&&d.start<x.end&&d.end>x.start);if(conflict)throw Error('Jadwal bentrok dengan '+conflict.start+'–'+conflict.end+'. Pilih waktu lain.');const daily=db.reservations.filter(x=>x.date===d.date&&!['Dibatalkan','Tidak hadir'].includes(x.status));for(const n of nims){const existing=daily.filter(x=>roomNims(x).includes(n));if(existing.some(x=>d.start<x.end&&d.end>x.start))throw Error('Seorang peserta sudah memiliki jadwal yang bertumpang tindih.');if(existing.reduce((a,x)=>a+minutes(x.end)-minutes(x.start),0)+duration>120)throw Error('Durasi harian kelompok / peserta melampaui 2 jam. Hubungi petugas untuk perpanjangan.')}return {r,nims}}

if(kind==='reviewloss'){guard(['admin']);let z=loss(d.id),l=loan(z.loan);if(z.status!=='Dilaporkan'||l.closed)throw Error('Kasus tidak dapat diproses.');if(z.by===WHO[role])throw Error('Persetujuan diri sendiri dilarang.');z.status=d.decision;if(d.decision==='Terkonfirmasi'){l.closed=today;l.outcome='Hilang';copy(l.copy).condition='Hilang'}save('Telaah kehilangan',z.id,'Dilaporkan',d.decision)}
if(kind==='invoice'){guard(['officer']);if(loss(d.loss)?.status!=='Terkonfirmasi')throw Error('Kehilangan belum terkonfirmasi.');if(db.invoices.some(i=>i.loss===d.loss&&i.status!=='Dibatalkan'))throw Error('Tagihan aktif sudah ada.');if(!Number.isInteger(+d.amount)||+d.amount<=0)throw Error('Nilai harus rupiah bulat positif.');let id=uid('INV',db.invoices);db.invoices.push({...d,id,amount:+d.amount,status:'Draf',by:WHO[role]});save('Susun tagihan',id)}
if(kind==='issueinvoice'){guard(['admin']);let i=inv(d.id);if(i.status!=='Draf'||i.by===WHO[role])throw Error('Tagihan tidak memenuhi syarat persetujuan.');i.status='Terbit';save('Terbitkan tagihan',i.id,'Draf','Terbit')}
if(kind==='reverse'){guard(['officer']);let p=db.payments.find(p=>p.id===d.payment);if(p?.status!=='Terverifikasi')throw Error('Pembayaran tidak terverifikasi.');if(db.reversals.some(r=>r.payment===p.id&&r.status!=='Ditolak'))throw Error('Permintaan pembalikan sudah ada.');let id=uid('REV',db.reversals);db.reversals.push({...d,id,status:'Menunggu',by:WHO[role],submittedAt:new Date().toISOString()});save('Ajukan pembalikan',id)}
if(kind==='approvereverse'){guard(['admin']);let r=db.reversals.find(r=>r.id===d.id),p=db.payments.find(p=>p.id===r.payment);if(r.status!=='Menunggu'||r.by===WHO[role])throw Error('Persetujuan tidak sah.');if(d.decision==='Disetujui'){if(p.status!=='Terverifikasi')throw Error('Status pembayaran telah berubah.');p.status='Dibalik';r.status='Dilaksanakan'}else r.status='Ditolak';save('Telaah pembalikan',r.id,'Menunggu',r.status)}
if(kind==='staff'){guard(['admin']);const email=d.email.trim().toLowerCase();if(db.accounts.some(u=>u.email?.toLowerCase()===email))throw Error('Email akun sudah terdaftar.');if(!['Petugas perpustakaan','Admin'].includes(d.role)||d.password.length<8)throw Error('Peran atau kata sandi contoh tidak valid.');const id=uid('U',db.accounts);db.accounts.push({id,name:d.name.trim(),email,role:d.role,status:'Aktif',demoPassword:d.password});save('Tambah akun staf',id,null,{name:d.name.trim(),email,role:d.role})}
if(kind==='accessupdate'){guard(['admin']);const u=db.accounts.find(u=>u.id===d.id);if(!u||u.email===sessionStorage.getItem('pustaka-email-ios-v3'))throw Error('Perubahan akses ditolak.');if(!Object.values(ROLES).includes(d.role)||!['Aktif','Nonaktif'].includes(d.status))throw Error('Peran atau status tidak valid.');const old={role:u.role,status:u.status};u.role=d.role;u.status=d.status;if(u.member){member(u.member).status=d.status}save('Ubah akses akun',u.id,old,{role:u.role,status:u.status,reason:d.reason})}
close();render();if(kind==='verify'&&d.decision==='Terverifikasi'){showPaymentDocument(d.id)}else toast('Catatan berhasil disimpan.');
}catch(err){const box=f.querySelector('.error');if(box){box.textContent=err.message;box.classList.add('show');box.scrollIntoView({block:'nearest'})}else toast(err.message)}});
document.querySelector('#modal').addEventListener('cancel',e=>{e.preventDefault();close()});
document.addEventListener('input',e=>{const id=e.target.id;if(['catalog-search','member-search'].includes(id)){const pos=e.target.selectionStart;searchTerm=e.target.value;render();const n=document.getElementById(id);n.focus();n.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.name==='method'){const bank=e.target.closest('form')?.querySelector('.bank-choice');if(bank)bank.hidden=e.target.value!=='bank';}if(e.target.id==='room-date'){roomSelectedDate=e.target.value;render()}if(e.target.id==='catalog-filter'){filter=e.target.value;render()}if(e.target.id==='monitor-member'){selectedMember=e.target.value;render()}});window.addEventListener('hashchange',()=>{render();if(newsScrollPending){scrollNews();newsScrollPending=false}else window.scrollTo(0,0)});render();

const renderBeforeOtp=render;render=function(){renderBeforeOtp();refreshOtpCooldown()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshOtpCooldown()});

const renderBeforeReferences=render;render=function(){renderBeforeReferences();rewriteVisibleReferences(document.querySelector('#app'))};
const modalBeforeReferences=modal;modal=function(html){refreshPublicReferences();modalBeforeReferences(html);rewriteVisibleReferences(document.querySelector('#modal'))};
const postcardBeforeReferences=showPostcard;showPostcard=function(data){refreshPublicReferences();postcardBeforeReferences(data);const root=document.querySelector('#modal');rewriteVisibleReferences(root);previousDocumentReferences(root,data.items.map(x=>x.ref).filter(Boolean))};
const paymentBeforeReferences=showPaymentDocument;showPaymentDocument=function(id,style){refreshPublicReferences();paymentBeforeReferences(id,style);const root=document.querySelector('#modal');rewriteVisibleReferences(root);previousDocumentReferences(root,[id,db.payments.find(x=>x.id===id)?.invoice].filter(Boolean))};
const invoiceBeforeReferences=showInvoiceDocument;showInvoiceDocument=function(id){invoiceBeforeReferences(id);previousDocumentReferences(document.querySelector('#modal'),[id])};
const toastBeforeReferences=toast;toast=function(message){toastBeforeReferences(publicReferenceText(message))};
render();
